name: Construire Asteriax Verse pour Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "main.py"
      - "ui/**"
      - "core/**"
      - "data/**"
      - "assets/**"
      - "requirements*.txt"
      - "AsteriaxVerse.spec"
      - "UPDATE_MANIFEST.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: python -m pip install -r requirements-build.txt
      - name: Construire l'exécutable
        run: pyinstaller --noconfirm --clean AsteriaxVerse.spec
      - name: Publier l'exécutable sur la branche principale
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          Copy-Item "dist/AsteriaxVerse.exe" "AsteriaxVerse.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AsteriaxVerse.exe
          if (git diff --cached --quiet) {
            Write-Host "L'exécutable publié est déjà à jour."
            exit 0
          }
          git commit -m "Build Windows Asteriax Verse 1.3.0"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: AsteriaxVerse-Windows
          path: dist/AsteriaxVerse.exe
