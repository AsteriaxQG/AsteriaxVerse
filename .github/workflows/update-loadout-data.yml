name: Update loadout data
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-loadout-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/update-loadout-data.mjs
      - run: node tests/loadout.mjs
      - name: Commit validated update
        run: |
          if git diff --quiet -- website/loadout/data/catalog.json; then exit 0; fi
          git config user.name "Asteriax Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add website/loadout/data/catalog.json
          git commit -m "data: update loadout catalogue"
          git push
