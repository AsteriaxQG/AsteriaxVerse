name: Website checks
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/website-checks.yml"
      - "website/**"
      - "tests/**"
      - "server/**"
      - "functions/**"
      - "data/changelog.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check website/app.js
      - run: node --check website/performance.js
      - run: node --check website/shipcatalog.js
      - run: node --check website/home.js
      - run: node --check website/vehiclefilters.js
      - run: node --check website/data-fixes.js
      - run: node --check website/loadout/index.js
      - run: node --check website/loadout/storage.js
      - run: node --check functions/api/ships.js
      - run: node tests/site-regressions.mjs
      - run: node tests/loadout.mjs
      - run: node tests/changelog.mjs
      - run: node tests/vehicle-pagination.mjs
      - run: node tests/ships-api.mjs
      - run: node tests/ship-pledge-availability.mjs
      - run: node tests/latest-releases.mjs
      - run: node tests/ship-patch-impact.mjs

      - run: node --check functions/api/launcher.js
      - run: node --check functions/api/news.js
      - run: node --check website/launcher.js
      - run: node tests/launcher.mjs
      - run: node tests/news-api.mjs
      - run: node --check website/status-ui.js
      - run: node --check functions/api/status.js
      - run: node tests/status-access.mjs
      - run: node --check website/iae.js
      - run: node tests/iae.mjs
