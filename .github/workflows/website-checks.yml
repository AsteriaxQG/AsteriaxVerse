name: Website checks
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/website-checks.yml"
      - "website/app.js"
      - "website/performance.js"
      - "website/shipcatalog.js"
      - "website/home.js"
      - "tests/latest-releases.mjs"
      - "tests/ship-patch-impact.mjs"
      - "website/index.html"
      - "functions/api/ships.js"
      - "tests/ships-api.mjs"
      - "tests/ship-pledge-availability.mjs"
      - "tests/vehicle-pagination.mjs"
      - "website/account-login.js"
      - "website/account-login.css"
      - "functions/api/auth/**"
      - "functions/api/hangar.js"
      - "server/account-auth.js"
      - "migrations/0002_email_accounts.sql"
      - "migrations/0003_email_password_accounts.sql"
      - "migrations/0004_email_verification_password_reset.sql"
      - "tests/account-auth.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check website/app.js
      - run: node --check website/performance.js
      - run: node --check website/shipcatalog.js
      - run: node --check website/home.js
      - run: node --check functions/api/ships.js
      - run: node --check functions/api/auth/register.js
      - run: node --check functions/api/auth/login.js
      - run: node --check functions/api/auth/session.js
      - run: node --check functions/api/auth/verify-email.js
      - run: node --check functions/api/auth/verification-resend.js
      - run: node --check functions/api/auth/password-reset/request.js
      - run: node --check functions/api/auth/password-reset/confirm.js
      - run: node --check functions/api/hangar.js
      - run: node --check website/account-login.js
      - run: node tests/account-auth.mjs
      - run: node tests/vehicle-pagination.mjs
      - run: node tests/ships-api.mjs
      - run: node tests/ship-pledge-availability.mjs
      - run: node tests/latest-releases.mjs
      - run: node tests/ship-patch-impact.mjs

